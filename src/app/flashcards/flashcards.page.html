<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Flashcards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <h1>{{ isRegistering ? 'Create Account' : 'Sign In' }}</h1>

    <form #authForm="ngForm" (ngSubmit)="submit()">
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" name="email" [(ngModel)]="email" required email autocomplete="username">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input type="password" name="password" [(ngModel)]="password" required
          [autocomplete]="isRegistering ? 'new-password' : 'current-password'">
        </ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="authForm.invalid || isLoading">
        {{ isLoading ? 'Please wait…' : (isRegistering ? 'Create Account' : 'Sign In') }}
      </ion-button>
    </form>

    <ion-button *ngIf="!isRegistering" type="button" expand="block" fill="outline" [disabled]="isLoading"
      (click)="signInAsGuest()">
      Sign in as Guest
    </ion-button>

    <ion-button fill="clear" expand="block" (click)="toggleMode()" [disabled]="isLoading">
      {{ isRegistering ? 'Already have an account? Sign in' : 'Create an account' }}
    </ion-button>

    <p *ngIf="message" role="status">{{ message }}</p>
  </div>
</ion-content>
