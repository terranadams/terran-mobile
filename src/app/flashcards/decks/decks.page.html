<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Decks</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button *ngIf="!showAddDeck" type="button" expand="block" [disabled]="loading || !!loadError"
    (click)="showAddDeck = true">
    Add Deck
  </ion-button>

  <form *ngIf="showAddDeck" (ngSubmit)="createDeck()">
    <ion-item>
      <ion-label position="stacked">Deck name</ion-label>
      <ion-input name="deckName" [(ngModel)]="name" [disabled]="saving">
      </ion-input>
    </ion-item>

    <ion-button type="submit" expand="block" [disabled]="loading || saving || !!loadError || !name.trim()">
      {{ saving ? 'Creating…' : 'Create Deck' }}
    </ion-button>

    <ion-button type="button" fill="clear" [disabled]="saving" (click)="closeAddDeckForm()">
      Cancel
    </ion-button>

    <p *ngIf="saveError" role="alert">{{ saveError }}</p>
  </form>

  <p *ngIf="loading" role="status">Loading decks…</p>
  <p *ngIf="loadError" role="alert">{{ loadError }}</p>

  <p *ngIf="!loading && !loadError && !showAddDeck && decks.length === 0">
    Create your first deck to get started.
  </p>

  <ion-list *ngIf="!loading && !loadError && decks.length">
    <ion-item *ngFor="let deck of decks" [routerLink]="['/flashcards/decks', deck.id]">
      <ion-label>{{ deck.name }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
