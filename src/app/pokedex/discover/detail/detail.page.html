<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/pokedex/discover"></ion-back-button>
    </ion-buttons>
    <ion-title>{{this.pokemon.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-content class="ion-padding">
    <div class="pokemon-detail">
      <div class="pokemon-summary">
        <ion-img class="pokemon-image" [src]="pokemon.defaultSprite"></ion-img>

        <p class="pokemon-description">{{ pokemon.description }}</p>
      </div>

      <div class="catch-wrapper">
        <ion-button class="favButton ion-padding" color="warning" [disabled]="pokemonAdded" (click)="catch()">
          CATCH THIS POKÉMON!
        </ion-button>
      </div>
    </div>
  </ion-content>
</ion-content>
